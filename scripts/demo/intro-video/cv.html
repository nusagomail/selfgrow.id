<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<!--
  Video pengantar "CV yang Dilirik Rekruter" (D46): dirancang khusus. Satu dunia sepanjang video:
  selembar CV di meja rekruter. Stopwatch berjalan 7,4 detik sementara titik pandangan menyapu
  bagian atas halaman dan meninggalkan jejak stabilo; sisanya memudar. Lalu satu baris tugas
  dicoret pena merah dan diganti kalimat pencapaian yang distabilo hijau. Kontrak: DURATION, TIMELINE, render(t).
-->
<style>
@font-face { font-family: Jakarta; src: url(font.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Hand; src: url(hand.woff2) format("woff2"); font-weight: 700; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 960px; height: 540px; overflow: hidden; }
body { font-family: Jakarta, sans-serif; color: #20232a; background: #e9e4dc; }
#stage { position: absolute; inset: 0; background: radial-gradient(120% 100% at 30% 20%, #f2eee8 0%, #e9e4dc 60%, #d9d2c6 100%); }
#a4 { position: absolute; left: 60px; top: 30px; width: 340px; height: 440px; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.18); padding: 26px 26px; overflow: hidden; }
.hl { position: absolute; left: 16px; height: 0; border-radius: 10px; background: #fff27a; opacity: .7; }
.row { position: relative; margin-top: 7px; }
.nm { font-weight: 800; font-size: 22px; letter-spacing: .04em; }
.sm { font-size: 11px; color: #7b818c; }
.sec { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #7b818c; margin-top: 12px; }
.jt { font-weight: 800; font-size: 12px; }
.ln { display: block; height: 7px; border-radius: 4px; background: #c9cdd6; }
#eye { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #d23b2f; background: rgba(210,59,47,.15); margin: -11px 0 0 -11px; }
#watch { position: absolute; left: 420px; top: 40px; width: 112px; height: 112px; border-radius: 50%; background: #20232a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,.25); }
#watch b { font-size: 30px; font-variant-numeric: tabular-nums; }
#watch small { font-size: 11px; opacity: .7; }
#watch::before { content: ""; position: absolute; top: -12px; width: 18px; height: 14px; border-radius: 4px; background: #20232a; }
.panel { position: absolute; left: 560px; right: 36px; top: 60px; bottom: 112px; opacity: 0; }
.kick { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #7b818c; }
.big { font-size: 34px; font-weight: 800; line-height: 1.12; margin-top: 8px; }
.sub { font-size: 17px; line-height: 1.45; margin-top: 10px; }
.old { margin-top: 14px; background: #fff; padding: 12px 14px; font-size: 16px; color: #7b818c; position: relative; }
.strike { position: absolute; left: 10px; top: 50%; height: 3px; background: #d23b2f; transform-origin: left; }
.new { margin-top: 10px; background: #fff; padding: 12px 14px; font-size: 17px; font-weight: 700; position: relative; overflow: hidden; }
.new .mk { position: absolute; left: 0; top: 0; bottom: 0; background: #b9f0b1; z-index: 0; }
.new span { position: relative; }
.pen { font-family: Hand, cursive; font-size: 26px; color: #d23b2f; margin-top: 10px; }
.end { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: center; }
.end img.cv { width: 110px; height: 165px; box-shadow: 0 10px 22px rgba(0,0,0,.2); border-radius: 3px 7px 7px 3px; }
.end h1 { font-size: 30px; font-weight: 800; line-height: 1.1; }
.btn { display: inline-block; margin-top: 12px; background: #20232a; color: #fff; font-weight: 800; font-size: 16px; padding: 10px 16px; border-radius: 8px; }
.brand { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 800; }
.brand img { width: 22px; height: 22px; }
#wm { position: absolute; right: 22px; top: 18px; display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14px; }
#wm img { width: 22px; height: 22px; }
.sub-cap { position: absolute; left: 30px; right: 30px; bottom: 12px; text-align: center; z-index: 20; }
.sub-cap span { display: inline-block; max-width: 820px; padding: 6px 14px; border-radius: 10px; background: rgba(32,35,42,.85); color: #fff; font-size: 17px; font-weight: 600; line-height: 1.35; }
</style>
</head>
<body>
<div id="stage">
  <div id="a4"></div>
  <div id="watch"><b id="sec">0,0</b><small>detik</small></div>
</div>
<div id="wm"><img src="mark.png" alt=""><span>SelfGrow</span></div>
<div class="sub-cap" id="cap"></div>
<script>
const D = window.DATA;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - (1 - x) ** 3;
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
function fade(e, p, dist = 20, axis = "Y") { const k = easeOut(p); e.style.opacity = k; e.style.transform = `translate${axis}(${(1 - k) * dist}px)`; }

const MIN = { scan: 9, top: 8, rewrite: 11, end: 6 };
const T = [];
let cur = 0;
for (const s of D.scenes) { const dur = Math.max(MIN[s.type] ?? 6, s.dur ?? 0); T.push({ type: s.type, start: cur, dur, say: s.say ?? null }); cur += dur; }
window.DURATION = cur;
window.TIMELINE = T.map(({ type, start, dur }) => ({ type, start, dur }));
const B = Object.fromEntries(T.map((b) => [b.type, b]));
const at = (type, f) => B[type].start + B[type].dur * f;

// Isi CV (garis abu = teks). Bagian "top" tetap terang, sisanya memudar.
const a4 = $("a4");
const hls = [[14, 62], [150, 24], [178, 36]].map(([y, h]) => { const d = el("div", "hl"); d.style.top = `${y}px`; d.dataset.h = h; d.style.width = "0"; a4.append(d); return d; });
const add = (node, top = true) => { const r = el("div", "row"); r.append(node); r.dataset.top = top ? "1" : ""; a4.append(r); return r; };
const line = (w) => { const l = el("span", "ln"); l.style.width = `${w}%`; return l; };
const rows = [
  add(el("div", "nm", "SEKAR AYU")),
  add(el("div", "sm", "Digital Marketing · Jakarta · 0812-xxxx")),
  add(el("div", "sec", "Ringkasan")),
  add(line(92)), add(line(74)),
  add(el("div", "sec", "Pengalaman")),
  add(el("div", "jt", "Staf Pemasaran Digital · PT Contoh")),
  add(line(88)), add(line(80)), add(line(60), false),
  add(el("div", "jt", "Magang Media Sosial · Toko Contoh"), false),
  add(line(84), false), add(line(55), false),
  add(el("div", "sec", "Pendidikan"), false), add(line(70), false), add(line(50), false),
  add(el("div", "sec", "Keahlian"), false), add(line(80), false),
];
const eye = el("div"); eye.id = "eye"; a4.append(eye);
// Jalur pandangan (pola huruf F) dalam koordinat halaman.
const PATH = [[30, 30], [220, 34], [40, 60], [200, 64], [30, 160], [260, 162], [40, 188], [220, 192], [40, 210], [120, 214]];
const eyeAt = (k) => { const n = PATH.length - 1; const f = k * n; const i = Math.min(n - 1, Math.floor(f)); const u = easeInOut(f - i); return [PATH[i][0] + (PATH[i + 1][0] - PATH[i][0]) * u, PATH[i][1] + (PATH[i + 1][1] - PATH[i][1]) * u]; };

const panels = {};
function panel(type, build) { if (!B[type]) return; const p = el("div", "panel"); $("stage").append(p); panels[type] = { p, anim: build(p) }; }
panel("scan", (p) => {
  const k = el("div", "kick", "Pandangan pertama"), b = el("div", "big", "7,4 detik."), s = el("div", "sub", "Rata-rata waktu rekruter melihat CV sebelum memutuskan lanjut atau tidak.");
  p.append(k, b, s);
  return (t, d) => { fade(k, prog(t, 0, 0.4)); fade(b, prog(t, 0.3, 1.0), 20); fade(s, prog(t, d * 0.45, d * 0.45 + 0.5), 12); };
});
panel("top", (p) => {
  const k = el("div", "kick", "Yang benar-benar terbaca"), b = el("div", "big", "Nama, jabatan, dan baris-baris pertama."), s = el("div", "sub", "Sisanya hanya dibaca kalau bagian atas sudah menarik.");
  p.append(k, b, s);
  return (t, d) => { fade(k, prog(t, 0, 0.4)); fade(b, prog(t, 0.3, 1.0), 20); fade(s, prog(t, d * 0.5, d * 0.5 + 0.5), 12); };
});
panel("rewrite", (p) => {
  const k = el("div", "kick", "Ilmunya: tugas → pencapaian");
  const o = el("div", "old", "Mengelola media sosial perusahaan"); const st = el("div", "strike"); o.append(st);
  const n = el("div", "new"); const mk = el("div", "mk"); n.append(mk, el("span", "", "Menaikkan pengikut Instagram 35% dalam 6 bulan melalui jadwal konten mingguan"));
  const pen = el("div", "pen", "kata kerja + hasil + angka + cara");
  p.append(k, o, n, pen);
  return (t, d) => {
    fade(k, prog(t, 0, 0.4)); fade(o, prog(t, 0.3, 0.8), 14);
    st.style.width = `${(o.offsetWidth - 20) * easeOut(prog(t, d * 0.3, d * 0.3 + 0.5))}px`;
    fade(n, prog(t, d * 0.4, d * 0.4 + 0.4), 14, "X");
    mk.style.width = `${100 * easeOut(prog(t, d * 0.5, d * 0.5 + 0.9))}%`;
    fade(pen, prog(t, d * 0.75, d * 0.75 + 0.4), 8);
  };
});
panel("end", (p) => {
  const w = el("div", "end"); const cv = el("img", "cv"); cv.src = "cover.jpg"; cv.alt = "";
  const tx = el("div"); tx.append(el("div", "kick", "Ebook SelfGrow · 6 bab · 2 alat bantu"), el("h1", "", "CV yang Dilirik Rekruter"), el("div", "btn", "Baca Bab 1, gratis"));
  const br = el("div", "brand"); const im = el("img"); im.src = "mark.png"; im.alt = ""; br.append(im, el("span", "", "SelfGrow")); tx.append(br);
  w.append(cv, tx); p.append(w);
  return (t) => { fade(cv, prog(t, 0.2, 0.9), 30); fade(tx, prog(t, 0.5, 1.2), 16, "X"); };
});

window.render = (t) => {
  for (const b of T) {
    const pn = panels[b.type]; if (!pn) continue;
    const last = b === T[T.length - 1];
    const inn = easeInOut(prog(t, b.start - 0.2, b.start + 0.25));
    const out = last ? 1 : 1 - easeInOut(prog(t, b.start + b.dur - 0.25, b.start + b.dur + 0.2));
    const o = Math.min(inn, out);
    pn.p.style.opacity = o;
    if (o > 0) pn.anim(t - b.start, b.dur);
  }
  // Stopwatch 0 → 7,4 detik dan titik pandangan selama adegan pertama.
  const k = B.scan ? prog(t, B.scan.start + 0.5, B.scan.start + B.scan.dur - 0.5) : 1;
  $("sec").textContent = (7.4 * k).toFixed(1).replace(".", ",");
  const [ex, ey] = eyeAt(k);
  eye.style.left = `${ex}px`; eye.style.top = `${ey}px`;
  eye.style.opacity = k > 0 && k < 1 ? 1 : 0;
  hls.forEach((h, i) => { const s = prog(k, i * 0.33, i * 0.33 + 0.3); h.style.height = `${h.dataset.h}px`; h.style.width = `${308 * easeOut(s)}px`; });
  // Bagian bawah memudar setelah pemindaian.
  const dim = B.top ? easeInOut(prog(t, B.top.start + 0.3, B.top.start + 1.3)) : 0;
  rows.forEach((r) => { r.style.opacity = r.dataset.top ? 1 : 1 - 0.75 * dim; });

  const cb = T.find((b) => t >= b.start && t < b.start + b.dur);
  const line2 = D.captions && cb ? cb.say : null;
  const cap = $("cap");
  if (cap.dataset.line !== (line2 ?? "")) { cap.dataset.line = line2 ?? ""; cap.replaceChildren(); if (line2) cap.append(el("span", "", line2)); }
};
render(0);
</script>
</body>
</html>
