<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<!--
  Template video pengantar ebook (D41, D43), 16:9. Kotak adegan, bukan urutan tetap:
  window.DATA.scenes berisi adegan pilihan penulis (lihat docs/PANDUAN-VIDEO.md).
  window.render(t) menggambar detik ke-t; window.TIMELINE memberi awal & durasi tiap adegan.
-->
<style>
@font-face { font-family: Jakarta; src: url(font.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Mono; src: url(mono.woff2) format("woff2"); font-weight: 500; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 960px; height: 540px; overflow: hidden; background: #073e1f; }
body { font-family: Jakarta, sans-serif; color: #fff; }
.scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #f4ac13; }
.paper .kicker { color: #b0570f; }
.wm { position: absolute; right: 26px; bottom: 20px; display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14px; opacity: 0; z-index: 10; }
.wm img { width: 22px; height: 22px; }
.dark { background: radial-gradient(110% 90% at 85% 0%, #1d7a34 0%, #073e1f 55%, #04260f 100%); }
.paper { background: radial-gradient(100% 80% at 50% 0%, #fffdf7, #f3ead8); color: #10241a; }
.night { background: radial-gradient(120% 100% at 20% 0%, #23304d 0%, #10182b 60%, #090d18 100%); }
.h2 { position: absolute; left: 80px; right: 80px; top: 64px; font-size: 38px; letter-spacing: -.02em; line-height: 1.12; }
.sub-cap { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 20; }
.sub-cap span { display: inline-block; max-width: 760px; padding: 6px 14px; border-radius: 10px; background: rgba(0,0,0,.62); color: #fff; font-size: 19px; font-weight: 600; line-height: 1.35; }

/* cover */
.cover-s .cover { position: absolute; left: 110px; top: 70px; width: 260px; height: 390px; border-radius: 5px 12px 12px 5px; overflow: hidden; box-shadow: 0 34px 60px rgba(0,0,0,.45); }
.cover-s .cover img { width: 100%; height: 100%; display: block; }
.cover-s .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.16) 4px, transparent 16px); }
.cover-s .txt { position: absolute; left: 430px; right: 70px; top: 120px; }
.cover-s h1 { font-size: 48px; line-height: 1.04; letter-spacing: -.025em; margin-top: 12px; }
.cover-s .sub { font-size: 19px; line-height: 1.45; opacity: .85; margin-top: 16px; }
.cover-s .meta { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.cover-s .meta span { padding: 7px 14px; border-radius: 99px; background: rgba(255,255,255,.12); font-weight: 700; font-size: 14px; }
.paper.cover-s .meta span { background: rgba(7,62,31,.08); }

/* list */
.list-s .list { position: absolute; left: 80px; right: 80px; top: 160px; display: grid; gap: 22px; }
.item { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; line-height: 1.25; }
.item .dot { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: #1d7a34; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
.item .dot.x { background: #b42318; color: #fff; }
.dark .item .dot, .night .item .dot { background: #f4ac13; color: #073e1f; }
.dark .item .dot.x, .night .item .dot.x { background: #e5533f; color: #fff; }

/* story */
.story-s .who { position: absolute; left: 80px; top: 70px; width: 380px; }
.story-s .who h2 { font-size: 38px; letter-spacing: -.02em; margin-top: 10px; }
.story-s .who p { font-size: 20px; opacity: .85; margin-top: 10px; line-height: 1.4; }
.avatar { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(150deg, #f4ac13, #e07a1f); display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 800; color: #073e1f; }
.story-s .stats { position: absolute; left: 500px; right: 70px; top: 110px; display: grid; gap: 16px; }
.stat { background: rgba(255,255,255,.1); border-radius: 18px; padding: 16px 22px; display: flex; align-items: baseline; gap: 14px; }
.paper .stat { background: #fff; box-shadow: 0 10px 24px rgba(7,62,31,.1); }
.stat b { font-size: 44px; letter-spacing: -.02em; color: #f4ac13; }
.paper .stat b { color: #b0570f; }
.stat span { font-size: 20px; font-weight: 700; }
.story-s .end { position: absolute; left: 80px; right: 80px; bottom: 70px; font-size: 22px; font-weight: 700; }

/* bigNumber */
.big-s .box { position: absolute; left: 80px; right: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
.big-s .num { font-size: 120px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: #f4ac13; }
.paper.big-s .num { color: #b0570f; }
.big-s .lbl { font-size: 28px; font-weight: 700; max-width: 720px; line-height: 1.3; }
.big-s .note { font-size: 15px; opacity: .7; max-width: 640px; }

/* question */
.q-s .box { position: absolute; left: 110px; right: 110px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.q-s .qt { font-size: 44px; font-weight: 800; line-height: 1.18; letter-spacing: -.02em; }
.q-s .qs { font-size: 22px; opacity: .8; line-height: 1.4; }

/* compare */
.cmp-s .cols { position: absolute; left: 80px; right: 80px; top: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.col { border-radius: 20px; padding: 22px; display: grid; gap: 12px; align-content: start; min-height: 290px; }
.col h3 { font-size: 22px; letter-spacing: .02em; }
.col p { font-size: 20px; font-weight: 600; line-height: 1.3; }
.col.l { background: rgba(180,35,24,.1); border-top: 6px solid #b42318; }
.col.r { background: rgba(29,122,52,.12); border-top: 6px solid #1d7a34; }
.dark .col.l, .night .col.l { background: rgba(255,255,255,.07); border-top-color: #ff8a7a; }
.dark .col.r, .night .col.r { background: rgba(255,255,255,.13); border-top-color: #f4ac13; }

/* stages */
.stages-s .stages { position: absolute; left: 80px; right: 80px; top: 150px; display: grid; gap: 16px; }
.stage { background: #fff; color: #10241a; border-radius: 20px; padding: 20px 18px; min-height: 250px; box-shadow: 0 16px 34px rgba(7,62,31,.14); display: flex; flex-direction: column; gap: 12px; border-top: 6px solid #1d7a34; }
.stage .n { width: 44px; height: 44px; border-radius: 50%; background: #1d7a34; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
.stage .t { font-size: 21px; font-weight: 800; line-height: 1.2; }
.stage .b { margin-top: auto; font-size: 15px; font-weight: 800; color: #1d7a34; letter-spacing: .04em; }

/* features */
.feat-s .feats { position: absolute; left: 80px; right: 80px; top: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.feat { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.1); border-radius: 20px; padding: 22px; font-size: 21px; font-weight: 700; line-height: 1.3; }
.paper .feat { background: #fff; box-shadow: 0 10px 24px rgba(7,62,31,.1); }
.feat .ic { font-size: 38px; }

/* quote */
.quote-s .box { position: absolute; left: 110px; right: 110px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; }
.quote-s .qt { font-size: 32px; font-weight: 700; line-height: 1.35; }
.quote-s .qt::before { content: "\201C"; display: block; font-size: 80px; line-height: .6; height: 34px; color: #1d7a34; }
.dark.quote-s .qt::before, .night.quote-s .qt::before { color: #f4ac13; }
.quote-s .cite { font-size: 18px; font-weight: 700; opacity: .75; }

/* chat */
.chat-s .wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 360px; gap: 40px; align-items: center; padding: 0 80px; }
.chat-s .side .kicker { margin-bottom: 12px; }
.chat-s .side h2 { font-size: 36px; line-height: 1.15; letter-spacing: -.02em; }
.chat-s .side p { font-size: 19px; opacity: .8; margin-top: 12px; line-height: 1.4; }
.chat-s .phone { background: #f2ece6; border-radius: 30px; padding: 18px 14px; height: 440px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; box-shadow: 0 24px 50px rgba(0,0,0,.35); border: 6px solid #1b1420; overflow: hidden; }
.chat-s .who { position: absolute; top: 0; }
.bubble { max-width: 82%; padding: 10px 13px; border-radius: 16px; font-size: 16px; line-height: 1.35; color: #1b1420; }
.bubble.them { background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.me { background: #ffd9c7; align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble.me.good { background: #bfe8e4; }
.typing { align-self: flex-end; background: #ffd9c7; border-radius: 16px; padding: 10px 14px; display: flex; gap: 5px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: #8a6f78; display: block; }

/* breath */
.breath-s .box { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
.breath-s .bt { font-size: 30px; font-weight: 700; text-align: center; max-width: 720px; line-height: 1.3; }
.breath-s .orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff8dc, #f3e6b5 45%, #c9b8f0 100%); box-shadow: 0 0 80px rgba(243,230,181,.45); }
.breath-s .bl { font-size: 24px; font-weight: 600; letter-spacing: .04em; opacity: .9; }

/* receipt: struk yang tercetak baris demi baris dari mesin kasir */
.rc-s .wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 380px; gap: 44px; align-items: center; padding: 0 80px; }
.rc-s .side .kicker { margin-bottom: 12px; }
.rc-s .side h2 { font-size: 36px; line-height: 1.15; letter-spacing: -.02em; }
.rc-s .side p { font-size: 19px; opacity: .8; margin-top: 12px; line-height: 1.4; }
.rc-s .printer { position: relative; height: 440px; }
.rc-s .slot { position: absolute; left: -14px; right: -14px; top: 0; height: 26px; border-radius: 10px; background: #2a1d14; box-shadow: 0 8px 18px rgba(0,0,0,.35); z-index: 2; }
.rc-s .clip { position: absolute; left: 0; right: 0; top: 13px; overflow: hidden; }
.rc-s .paper-r { background: #fffdf6; color: #2a1d14; font-family: Mono, monospace; font-size: 17px; padding: 26px 22px 30px; box-shadow: 0 18px 30px rgba(0,0,0,.25); clip-path: polygon(0 0,100% 0,100% calc(100% - 8px),95% 100%,90% calc(100% - 8px),85% 100%,80% calc(100% - 8px),75% 100%,70% calc(100% - 8px),65% 100%,60% calc(100% - 8px),55% 100%,50% calc(100% - 8px),45% 100%,40% calc(100% - 8px),35% 100%,30% calc(100% - 8px),25% 100%,20% calc(100% - 8px),15% 100%,10% calc(100% - 8px),5% 100%,0 calc(100% - 8px)); }
.rc-s .hd { text-align: center; font-weight: 700; letter-spacing: .08em; }
.rc-s .hd small { display: block; font-weight: 500; font-size: 12px; opacity: .7; margin-top: 2px; letter-spacing: 0; }
.rc-s .rl { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
.rc-s .rl.miss span:first-child::after { content: " ✱"; color: #c2410c; }
.rc-s .rl.miss { color: #c2410c; }
.rc-s .dash { border-top: 2px dashed #b9a58c; margin: 10px 0; }
.rc-s .tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 19px; }
.rc-s .stamp { position: absolute; right: 10px; transform: rotate(-12deg); border: 4px solid #c2410c; color: #c2410c; border-radius: 10px; padding: 6px 14px; font-family: Mono, monospace; font-weight: 700; font-size: 26px; letter-spacing: .06em; background: rgba(255,253,246,.6); z-index: 3; }

/* cta */
.cta-s .box { position: absolute; left: 110px; right: 110px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 26px; }
.cta-s .lead { font-size: 30px; font-weight: 700; line-height: 1.35; }
.cta-s .btn { background: #1d7a34; color: #fff; border-radius: 99px; padding: 18px 40px; font-weight: 800; font-size: 26px; box-shadow: 0 14px 30px rgba(29,122,52,.35); }
.dark.cta-s .btn, .night.cta-s .btn { background: #f4ac13; color: #073e1f; }
.cta-s .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; }
.cta-s .brand img { width: 34px; height: 34px; }
</style>
</head>
<body>
<div class="wm" id="wm"><img src="mark.png" alt=""><span>SelfGrow</span></div>
<div class="sub-cap" id="cap"></div>

<script>
const D = window.DATA;
// Tema warna per buku (opsional): latar gelap/malam dan warna aksen, supaya video ikut identitas buku.
if (D.theme) {
  const t = D.theme;
  const css = [
    t.dark && `.dark{background:${t.dark}}`,
    t.night && `.night{background:${t.night}}`,
    t.paper && `.paper{background:${t.paper}}`,
    t.accent &&
      `.kicker,.big-s .num,.stat b,.dark .kicker,.night .kicker{color:${t.accent}}.dark .item .dot,.night .item .dot,.dark.cta-s .btn,.night.cta-s .btn{background:${t.accent};color:${t.accentInk ?? "#fff"}}.dark.quote-s .qt::before,.night.quote-s .qt::before{color:${t.accent}}`,
    t.primary &&
      `.paper .kicker{color:${t.primary}}.paper.cta-s .btn,.item .dot,.stage .n{background:${t.primary}}.stage{border-top-color:${t.primary}}.stage .b,.quote-s .qt::before{color:${t.primary}}`,
  ]
    .filter(Boolean)
    .join("");
  const st = document.createElement("style");
  st.textContent = css;
  document.head.append(st);
}
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - (1 - x) ** 3;
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const back = (x) => { const c = 1.5; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
function rise(e, p, dist = 24, axis = "Y") { e.style.opacity = p; e.style.transform = `translate${axis}(${(1 - p) * dist}px)`; }
/** Jarak antar butir yang muncul bergiliran: mulai `from`, selesai sekitar 60% durasi adegan. */
const stagger = (n, dur, from = 1.0, maxStep = 1.2) => Math.max(0.25, Math.min(maxStep, (dur * 0.6 - from) / Math.max(1, n)));

/*
 * Kotak adegan. Setiap jenis: build(scene, root) mengisi elemen dan mengembalikan
 * animate(tLokal, durasi). min(scene) = durasi minimum bila tidak ada narasi.
 * Semua teks lewat textContent.
 */
const KINDS = {
  cover: {
    bg: "dark",
    min: () => 6.5,
    build(s, r) {
      r.classList.add("cover-s");
      const cv = el("div", "cover"); const img = el("img"); img.src = "cover.jpg"; img.alt = ""; cv.append(img);
      const tx = el("div", "txt");
      const k = el("div", "kicker", s.kicker ?? ""); const h = el("h1", "", s.title); const sub = el("p", "sub", s.subtitle ?? "");
      const meta = el("div", "meta"); for (const m of s.meta ?? []) meta.append(el("span", "", m));
      tx.append(k, h, sub, meta); r.append(cv, tx);
      return (t) => {
        const c = back(prog(t, 0.2, 1.3));
        cv.style.opacity = clamp(c * 1.4);
        cv.style.transform = `translateY(${(1 - c) * 80}px) perspective(900px) rotateY(${12 * (1 - prog(t, 0.5, 4))}deg)`;
        rise(k, easeOut(prog(t, 0.9, 1.4)), 16, "X");
        rise(h, easeOut(prog(t, 1.1, 1.8)), 30, "X");
        rise(sub, easeOut(prog(t, 1.7, 2.4)), 20, "X");
        [...meta.children].forEach((m, i) => { rise(m, easeOut(prog(t, 2.5 + i * 0.25, 2.9 + i * 0.25)), 14); });
      };
    },
  },
  list: {
    bg: "paper",
    min: (s) => 2.5 + s.items.length * 1.4,
    build(s, r) {
      r.classList.add("list-s");
      const h = el("h2", "h2", s.title); const list = el("div", "list");
      s.items.forEach((a, i) => {
        const it = el("div", "item");
        const mark = s.mark === "number" ? String(i + 1) : s.mark === "x" ? "✕" : "✓";
        it.append(el("span", `dot${s.mark === "x" ? " x" : ""}`, mark), el("span", "", a));
        list.append(it);
      });
      r.append(h, list);
      return (t, dur) => {
        rise(h, easeOut(prog(t, 0.2, 0.8)));
        const st = stagger(s.items.length, dur);
        [...list.children].forEach((it, i) => {
          rise(it, easeOut(prog(t, 1.0 + i * st, 1.5 + i * st)), 30, "X");
          it.firstChild.style.transform = `scale(${back(prog(t, 1.2 + i * st, 1.6 + i * st))})`;
        });
      };
    },
  },
  story: {
    bg: "dark",
    min: (s) => 4 + (s.stats?.length ?? 0) * 1.1,
    build(s, r) {
      r.classList.add("story-s");
      const who = el("div", "who");
      who.append(el("div", "avatar", s.initial ?? "•"), el("h2", "", s.title), el("p", "", (s.lines ?? []).join(" · ")));
      const stats = el("div", "stats");
      for (const [b, l] of s.stats ?? []) { const st = el("div", "stat"); st.append(el("b", "", b), el("span", "", l)); stats.append(st); }
      const end = el("div", "end", s.end ?? "");
      r.append(who, stats, end);
      return (t, dur) => {
        rise(who, easeOut(prog(t, 0.2, 0.9)));
        const st = stagger(stats.children.length, dur * 0.8, 1.6, 0.9);
        [...stats.children].forEach((x, i) => { rise(x, easeOut(prog(t, 1.6 + i * st, 2.1 + i * st)), 40, "X"); });
        const e0 = Math.max(2.5, dur - 2.6);
        rise(end, easeOut(prog(t, e0, e0 + 0.6)));
      };
    },
  },
  bigNumber: {
    bg: "night",
    min: () => 5,
    build(s, r) {
      r.classList.add("big-s");
      const box = el("div", "box");
      const k = el("div", "kicker", s.kicker ?? ""); const n = el("div", "num", s.value);
      const l = el("div", "lbl", s.label ?? ""); const note = el("div", "note", s.note ?? "");
      box.append(k, n, l, note); r.append(box);
      // Angka di depan nilai (mis. "Rp1,6 jt", "73%") dihitung naik; sisanya tetap.
      const m = /^(\D*)(\d+(?:[.,]\d+)?)(.*)$/.exec(s.value);
      return (t) => {
        rise(k, easeOut(prog(t, 0.2, 0.7)), 14);
        const p = easeOut(prog(t, 0.5, 2.0));
        n.style.opacity = clamp(p * 2);
        n.style.transform = `scale(${0.7 + 0.3 * back(prog(t, 0.5, 1.3))})`;
        if (m) {
          const dec = (m[2].split(/[.,]/)[1] ?? "").length;
          const v = Number(m[2].replace(",", ".")) * p;
          n.textContent = `${m[1]}${v.toFixed(dec).replace(".", ",")}${m[3]}`;
        }
        rise(l, easeOut(prog(t, 1.6, 2.2)), 18);
        rise(note, easeOut(prog(t, 2.4, 3.0)), 10);
      };
    },
  },
  question: {
    bg: "dark",
    min: () => 4.5,
    build(s, r) {
      r.classList.add("q-s");
      const box = el("div", "box");
      const q = el("div", "qt", s.text); const sub = el("div", "qs", s.sub ?? "");
      box.append(q, sub); r.append(box);
      return (t) => { rise(q, easeOut(prog(t, 0.3, 1.2)), 30); rise(sub, easeOut(prog(t, 1.6, 2.3)), 16); };
    },
  },
  compare: {
    bg: "paper",
    min: (s) => 3 + Math.max(s.left.items.length, s.right.items.length) * 1.2,
    build(s, r) {
      r.classList.add("cmp-s");
      const h = el("h2", "h2", s.title ?? ""); const cols = el("div", "cols");
      const col = (side, c) => { const x = el("div", `col ${side}`); x.append(el("h3", "", c.title)); for (const it of c.items) x.append(el("p", "", it)); return x; };
      const L = col("l", s.left); const R = col("r", s.right);
      cols.append(L, R); r.append(h, cols);
      return (t, dur) => {
        rise(h, easeOut(prog(t, 0.2, 0.8)));
        const half = Math.max(1.6, dur * 0.42);
        for (const [c, t0] of [[L, 0.9], [R, 0.9 + half]]) {
          rise(c, easeOut(prog(t, t0, t0 + 0.6)), 30);
          [...c.querySelectorAll("p")].forEach((p, i) => { rise(p, easeOut(prog(t, t0 + 0.5 + i * 0.5, t0 + 0.9 + i * 0.5)), 14); });
        }
      };
    },
  },
  stages: {
    bg: "paper",
    min: (s) => 2.5 + s.items.length * 1.6,
    build(s, r) {
      r.classList.add("stages-s");
      const h = el("h2", "h2", s.title); const g = el("div", "stages");
      g.style.gridTemplateColumns = `repeat(${s.items.length}, 1fr)`;
      s.items.forEach(([t, b], i) => { const x = el("div", "stage"); x.append(el("div", "n", String(i + 1)), el("div", "t", t), el("div", "b", b ?? "")); g.append(x); });
      r.append(h, g);
      return (t, dur) => {
        rise(h, easeOut(prog(t, 0.2, 0.8)));
        const st = stagger(s.items.length, dur, 1.0, 1.6);
        [...g.children].forEach((x, i) => {
          const p = back(prog(t, 1.0 + i * st, 1.6 + i * st));
          x.style.opacity = clamp(p * 1.5); x.style.transform = `translateY(${(1 - p) * 50}px)`;
        });
      };
    },
  },
  features: {
    bg: "dark",
    min: (s) => 2.5 + s.items.length * 1.2,
    build(s, r) {
      r.classList.add("feat-s");
      const h = el("h2", "h2", s.title); const g = el("div", "feats");
      for (const [ic, t] of s.items) { const f = el("div", "feat"); f.append(el("span", "ic", ic), el("span", "", t)); g.append(f); }
      r.append(h, g);
      return (t, dur) => {
        rise(h, easeOut(prog(t, 0.2, 0.8)));
        const st = stagger(s.items.length, dur);
        [...g.children].forEach((f, i) => {
          const p = back(prog(t, 1.0 + i * st, 1.5 + i * st));
          f.style.opacity = clamp(p * 1.5); f.style.transform = `scale(${0.85 + 0.15 * p})`;
        });
      };
    },
  },
  quote: {
    bg: "paper",
    min: (s) => Math.max(4.5, s.text.length / 16),
    build(s, r) {
      r.classList.add("quote-s");
      const box = el("div", "box"); const q = el("div", "qt", s.text); const c = el("div", "cite", s.cite ? `— ${s.cite}` : "");
      box.append(q, c); r.append(box);
      return (t) => { rise(q, easeOut(prog(t, 0.2, 1.0)), 20); rise(c, easeOut(prog(t, 1.4, 2.0)), 10); };
    },
  },
  chat: {
    bg: "night",
    min: (s) => 2.5 + s.messages.length * 1.6,
    build(s, r) {
      r.classList.add("chat-s");
      const wrap = el("div", "wrap");
      const side = el("div", "side");
      side.append(el("div", "kicker", s.kicker ?? ""), el("h2", "", s.title ?? ""), el("p", "", s.sub ?? ""));
      const phone = el("div", "phone");
      const items = s.messages.map((m) => {
        const b = el("div", `bubble ${m.from}${m.good ? " good" : ""}`, m.text);
        let typing = null;
        if (m.from === "me") {
          typing = el("div", "typing");
          typing.append(el("i"), el("i"), el("i"));
          phone.append(typing);
        }
        phone.append(b);
        return { b, typing };
      });
      wrap.append(side, phone);
      r.append(wrap);
      return (t, dur) => {
        rise(side, easeOut(prog(t, 0.2, 0.9)), 24, "X");
        const step = Math.max(0.9, Math.min(2.2, (dur * 0.8 - 0.8) / Math.max(1, items.length)));
        items.forEach(({ b, typing }, i) => {
          const t0 = 0.8 + i * step;
          const typeFor = typing ? Math.min(0.9, step * 0.5) : 0;
          if (typing) {
            const on = t >= t0 && t < t0 + typeFor;
            typing.style.display = on ? "flex" : "none";
            [...typing.children].forEach((d, k) => { d.style.opacity = 0.35 + 0.65 * Math.abs(Math.sin((t - t0) * 6 + k * 0.8)); });
          }
          const shown = t >= t0 + typeFor;
          b.style.display = shown ? "block" : "none";
          const p = easeOut(prog(t, t0 + typeFor, t0 + typeFor + 0.35));
          b.style.opacity = p;
          b.style.transform = `translateY(${(1 - p) * 12}px) scale(${0.96 + 0.04 * p})`;
        });
      };
    },
  },
  breath: {
    bg: "night",
    min: () => 12,
    build(s, r) {
      r.classList.add("breath-s");
      const box = el("div", "box");
      const t1 = el("div", "bt", s.title ?? "");
      const orb = el("div", "orb");
      const lbl = el("div", "bl", "");
      box.append(t1, orb, lbl);
      r.append(box);
      // Siklus 4 detik tarik, 2 tahan, 4 hembus (ditampilkan perlahan, satu atau dua putaran).
      const steps = s.steps ?? ["Tarik napas…", "Tahan…", "Hembuskan…"];
      return (t) => {
        rise(t1, easeOut(prog(t, 0.2, 1.0)), 16);
        const c = Math.max(0, t - 1.2) % 10;
        let k;
        let label;
        if (c < 4) {
          k = easeInOut(c / 4);
          label = steps[0];
        } else if (c < 6) {
          k = 1;
          label = steps[1];
        } else {
          k = 1 - easeInOut((c - 6) / 4);
          label = steps[2];
        }
        const on = t > 1.2 ? 1 : prog(t, 0.6, 1.2);
        orb.style.opacity = on;
        orb.style.transform = `scale(${0.55 + 0.55 * k})`;
        if (lbl.textContent !== label) lbl.textContent = t > 1.2 ? label : "";
        lbl.style.opacity = on;
      };
    },
  },
  receipt: {
    bg: "dark",
    min: (s) => 3 + s.lines.length * 0.8,
    build(s, r) {
      r.classList.add("rc-s");
      const wrap = el("div", "wrap");
      const side = el("div", "side");
      side.append(el("div", "kicker", s.kicker ?? ""), el("h2", "", s.title ?? ""), el("p", "", s.sub ?? ""));
      const printer = el("div", "printer");
      const clip = el("div", "clip");
      const paper = el("div", "paper-r");
      const hd = el("div", "hd", s.header ?? "");
      if (s.headerSub) hd.append(el("small", "", s.headerSub));
      paper.append(hd, el("div", "dash"));
      const rows = s.lines.map(([a, b, miss]) => {
        const row = el("div", `rl${miss ? " miss" : ""}`);
        row.append(el("span", "", a), el("span", "", b));
        paper.append(row);
        return row;
      });
      const dash = el("div", "dash");
      const tot = el("div", "tot");
      tot.append(el("span", "", s.total?.[0] ?? ""), el("span", "", s.total?.[1] ?? ""));
      paper.append(dash, tot);
      clip.append(paper);
      const stamp = s.stamp ? el("div", "stamp", s.stamp) : null;
      printer.append(el("div", "slot"), clip);
      if (stamp) printer.append(stamp);
      wrap.append(side, printer);
      r.append(wrap);
      return (t, dur) => {
        rise(side, easeOut(prog(t, 0.2, 0.9)), 24, "X");
        // Kertas keluar dari celah printer, memanjang mengikuti baris yang sudah tercetak.
        const step = Math.max(0.35, Math.min(1.1, (dur * 0.62 - 0.8) / (rows.length + 1)));
        const H = paper.offsetHeight;
        const hTop = hd.offsetHeight + 48;
        let shown = hTop * easeOut(prog(t, 0.3, 0.8));
        rows.forEach((row, i) => {
          const p = easeOut(prog(t, 0.8 + i * step, 0.8 + i * step + 0.3));
          row.style.opacity = p;
          shown += row.offsetHeight * p;
        });
        const tEnd = 0.8 + rows.length * step;
        const pt = easeOut(prog(t, tEnd, tEnd + 0.4));
        dash.style.opacity = pt;
        tot.style.opacity = pt;
        shown += (H - shown) * pt;
        clip.style.height = `${shown + 12}px`;
        if (stamp) {
          stamp.style.top = `${H + 4}px`;
          // Cap jatuh menjelang akhir adegan, saat narasi sampai pada kesimpulannya.
          const s0 = Math.max(tEnd + 0.7, dur - 3.4);
          const k = back(prog(t, s0, s0 + 0.4));
          stamp.style.opacity = clamp(k * 1.5);
          stamp.style.transform = `rotate(-12deg) scale(${2.2 - 1.2 * k})`;
        }
      };
    },
  },
  cta: {
    bg: "paper",
    min: () => 5,
    build(s, r) {
      r.classList.add("cta-s");
      const box = el("div", "box");
      const lead = el("div", "lead", s.lead ?? ""); const btn = el("div", "btn", s.button);
      const brand = el("div", "brand"); const img = el("img"); img.src = "mark.png"; img.alt = ""; brand.append(img, el("span", "", "SelfGrow"));
      if (s.lead) box.append(lead);
      box.append(btn, brand); r.append(box);
      return (t) => {
        rise(lead, easeOut(prog(t, 0.2, 0.9)), 20);
        const k = back(prog(t, s.lead ? 1.0 : 0.3, s.lead ? 1.8 : 1.1));
        btn.style.opacity = clamp(k * 1.4);
        btn.style.transform = `translateY(${(1 - k) * 30}px) scale(${1 + 0.035 * Math.sin(Math.max(0, t - 2.2) * 5) * prog(t, 2.2, 2.6)})`;
        rise(brand, easeOut(prog(t, 1.6, 2.2)), 10);
      };
    },
  },
};

// Bangun adegan dan garis waktu. Durasi: `dur` dari data (mis. panjang narasi) atau minimum jenisnya.
const FADE = 0.4;
const timeline = [];
let cursor = 0;
for (const s of D.scenes) {
  const kind = KINDS[s.type];
  if (!kind) throw new Error(`Jenis adegan tidak dikenal: ${s.type}`);
  const bg = s.bg ?? kind.bg;
  const root = el("div", `scene ${bg}`);
  document.body.insertBefore(root, $("wm"));
  const animate = kind.build(s, root);
  const dur = Math.max(kind.min(s), s.dur ?? 0);
  timeline.push({ type: s.type, start: cursor, dur, root, animate, bg, caption: s.say ?? null });
  cursor += dur;
}
const DUR = cursor;

window.DURATION = DUR;
window.TIMELINE = timeline.map(({ type, start, dur }) => ({ type, start, dur }));
window.render = (t) => {
  let current = null;
  timeline.forEach((sc, i) => {
    const a = sc.start;
    const b = sc.start + sc.dur;
    const inn = i === 0 ? 1 : easeInOut(prog(t, a - FADE, a + FADE * 0.3));
    const out = i === timeline.length - 1 ? 1 : 1 - easeInOut(prog(t, b - FADE * 0.3, b + FADE));
    const o = Math.min(inn, out);
    sc.root.style.opacity = o;
    sc.root.style.visibility = o > 0 ? "visible" : "hidden";
    if (o > 0) sc.animate(t - a, sc.dur);
    if (t >= a && t < b) current = sc;
  });
  const wm = $("wm");
  const showWm = current && current.type !== "cover" && current.type !== "cta";
  wm.style.opacity = showWm ? 0.85 : 0;
  wm.style.color = current && current.bg === "paper" ? "#10241a" : "#fff";
  // Teks narasi di layar (subtitle), bila DATA.captions aktif.
  const cap = $("cap");
  const line = current && D.captions ? current.caption : null;
  if (cap.dataset.line !== (line ?? "")) {
    cap.dataset.line = line ?? "";
    cap.replaceChildren();
    if (line) cap.append(el("span", "", line));
  }
};
render(0);
</script>
</body>
