name: Deploy staging

# Setiap merge ke main: test, migrasi D1 staging, deploy Worker app lalu Worker site
# (etalase publik, mengambil katalog dari app lewat service binding) ke workers.dev (D15).
# Butuh GitHub Secrets (lihat docs/SETUP.md bagian 3):
#   CLOUDFLARE_API_TOKEN (wajib), GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAILS,
#   CLOUDFLARE_ACCOUNT_ID (opsional), STAGING_TURNSTILE_SECRET_KEY (opsional).
# Tanpa CLOUDFLARE_API_TOKEN workflow dilewati, tidak gagal.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Token Cloudflare hanya diberikan ke langkah yang membutuhkannya, tidak ke `pnpm install`
    # (skrip instal paket pihak ketiga tidak boleh bisa membacanya).
    env:
      WORKER_NAME: selfgrow-app-staging
    steps:
      - name: Cek token Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN belum diset, deploy staging dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.gate.outputs.skip != 'true'
        run: pnpm lint && pnpm typecheck && pnpm test

      # Sebelum build: setelah build, wrangler membaca config hasil build yang tidak
      # dipakai oleh perintah d1, sehingga --env staging harus dipakai di sini.
      - name: Migrasi D1 staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: steps.gate.outputs.skip != 'true'
        working-directory: apps/app
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Build app (staging)
        if: steps.gate.outputs.skip != 'true'
        working-directory: apps/app
        run: CLOUDFLARE_ENV=staging pnpm build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: steps.gate.outputs.skip != 'true'
        id: deploy
        working-directory: apps/app
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deploy tidak menghasilkan alamat workers.dev. Daftarkan subdomain workers.dev di dashboard Cloudflare (Workers & Pages)."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set secret Worker
        if: steps.gate.outputs.skip != 'true'
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.STAGING_TURNSTILE_SECRET_KEY }}
        run: |
          existing=$(npx wrangler secret list --name "$WORKER_NAME" --format json 2>/dev/null || echo '[]')
          args=()
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ADMIN_EMAILS TURNSTILE_SECRET_KEY; do
            v="${!k}"
            [ -n "$v" ] && args+=(--arg "$k" "$v")
          done
          # BETTER_AUTH_SECRET dibuat acak sekali saja, tidak pernah ditampilkan.
          if ! echo "$existing" | jq -e '.[] | select(.name == "BETTER_AUTH_SECRET")' >/dev/null; then
            args+=(--arg BETTER_AUTH_SECRET "$(openssl rand -hex 32)")
          fi
          if [ ${#args[@]} -gt 0 ]; then
            jq -n '$ARGS.named' "${args[@]}" > "$RUNNER_TEMP/secrets.json"
            npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" --name "$WORKER_NAME"
            rm -f "$RUNNER_TEMP/secrets.json"
          fi

      # Site sesudah app: service binding APP butuh Worker app staging sudah ada.
      - name: Build & deploy site (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: steps.gate.outputs.skip != 'true'
        id: site
        working-directory: apps/site
        run: |
          set -o pipefail
          CLOUDFLARE_ENV=staging pnpm build
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deploy site tidak menghasilkan alamat workers.dev."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.gate.outputs.skip != 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          # Staging dikunci Cloudflare Access (D17): request tanpa login harus dialihkan ke
          # halaman login Access. Itu sekaligus bukti Worker hidup dan terlindungi.
          for i in 1 2 3 4 5 6; do
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "$url/api/v1/health" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v1/health" || true)
            if echo "$loc" | grep -q 'cloudflareaccess.com'; then status="protected"; break; fi
            if [ "$code" = "200" ]; then status="public"; break; fi
            sleep 5
          done
          echo "status=$status code=$code"
          if [ "$status" = "public" ]; then
            echo "::warning::Staging tidak terlindungi Cloudflare Access."
          elif [ "$status" != "protected" ]; then
            echo "::error::Staging tidak merespons."
            exit 1
          fi
          # Site publik (noindex di staging): beranda harus 200 dan memuat kategori dari app.
          site="${{ steps.site.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            body=$(curl -s "$site/" || true)
            echo "$body" | grep -q 'Keuangan Pribadi' && site_ok=yes && break
            sleep 5
          done
          if [ "$site_ok" != "yes" ]; then
            echo "::error::Site staging tidak menampilkan kategori dari app."
            exit 1
          fi
          {
            echo "### Staging ter-deploy"
            echo ""
            echo "- Site: $site"
            echo "- App: $url"
            echo "- Cloudflare Access: $status"
            echo "- Redirect URI Google OAuth: \`$url/api/v1/auth/callback/google\`"
          } >> "$GITHUB_STEP_SUMMARY"
