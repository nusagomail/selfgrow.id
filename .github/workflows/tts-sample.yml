# Eksperimen narasi open source untuk video pengantar (D43). Manual atau saat skripnya berubah.
name: Contoh narasi (eksperimen)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["scripts/tts/**", ".github/workflows/tts-sample.yml"]

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chatterbox-id
            install: pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install --quiet chatterbox-tts==0.1.1 "transformers==4.46.3" peft==0.11.1 huggingface_hub safetensors && pip install --quiet -U ml_dtypes
            script: chatterbox_id_sample.py
          - name: csm-id
            install: pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install --quiet "transformers>=4.52.1" soundfile accelerate peft
            script: csm_id_sample.py
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Daftar berkas model
        run: curl -s "https://huggingface.co/api/models/Ellbendls/csm-1b-indonesian-fine-tuned" | python -c "import json,sys;print([s['rfilename'] for s in json.load(sys.stdin)['siblings']])"
      - name: Pasang
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ${{ matrix.install }}
      - name: Buat contoh suara
        working-directory: scripts/tts
        run: python ${{ matrix.script }} && mv tts-out ../../tts-out
      - name: Contoh resmi pembuat model
        if: always() && matrix.name == 'chatterbox-id'
        run: |
          mkdir -p tts-out
          for f in example1 example2; do curl -sL -o "tts-out/cbid-resmi-$f.wav" "https://huggingface.co/grandhigh/Chatterbox-TTS-Indonesian/resolve/main/$f.wav"; done
      # Hasil dikompres lalu dicetak sebagai base64 di log (artefak tidak terjangkau dari sesi pengembangan).
      - name: Cetak hasil
        if: always()
        run: |
          for f in tts-out/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -c:a libopus -b:a 32k "${f%.wav}.ogg" || continue
            echo "=== BEGIN $(basename "${f%.wav}") ==="
            base64 -w 0 "${f%.wav}.ogg"; echo
            echo "=== END ==="
          done
