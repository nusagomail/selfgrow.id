# Eksperimen narasi open source untuk video pengantar (D43). Manual atau saat skripnya berubah.
name: Contoh narasi (eksperimen)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["scripts/tts/**", ".github/workflows/tts-sample.yml"]

permissions:
  contents: read

jobs:
  omnivoice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Info model Indonesia lain (kartu model)
        run: |
          for m in grandhigh/Chatterbox-TTS-Indonesian Ellbendls/csm-1b-indonesian-fine-tuned k2-fsa/OmniVoice; do
            echo "=== CARD $m ==="
            curl -sL "https://huggingface.co/$m/raw/main/README.md" | head -c 6000
            echo
          done
      - name: Pasang OmniVoice (CPU)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet omnivoice soundfile
      - name: Buat contoh suara
        run: python scripts/tts/omnivoice_sample.py
      # Hasil dikompres lalu dicetak sebagai base64 di log (artefak tidak terjangkau dari sesi pengembangan).
      - name: Cetak hasil
        run: |
          for f in tts-out/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -c:a libopus -b:a 32k "${f%.wav}.ogg"
            echo "=== BEGIN $(basename "${f%.wav}") ==="
            base64 -w 0 "${f%.wav}.ogg"; echo
            echo "=== END ==="
          done
