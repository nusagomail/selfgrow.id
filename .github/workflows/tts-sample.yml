# Eksperimen narasi open source untuk video pengantar (D43). Manual atau saat skripnya berubah.
name: Contoh narasi (eksperimen)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["scripts/tts/**", ".github/workflows/tts-sample.yml"]

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang model suara (CPU)
        run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts==0.1.7
      - name: Buat contoh suara
        run: python scripts/tts/sample.py
      - uses: actions/upload-artifact@v4
        with:
          name: contoh-narasi
          path: tts-out/*.wav
          retention-days: 7
