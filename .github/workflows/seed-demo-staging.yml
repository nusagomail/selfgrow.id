name: Seed konten demo (staging)

# Mengisi 10 ebook DEMO + sampul ke D1 & R2 staging (D36). Hanya dijalankan manual
# (Actions → Seed konten demo → Run workflow). Idempoten; tidak pernah menyentuh production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrasi D1 staging (pastikan skema terbaru)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/app
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Isi konten demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/app
        run: node ../../scripts/demo/seed.mjs --staging
